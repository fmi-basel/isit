[DEFAULT]
# luigi output directory for logs, parsed data collections, etc.
outdir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_nuclei_seg/training_output

training_dir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_nuclei_seg/training_output

collection_name=nuclei_seg_training_collection
datadir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_nuclei_seg
pattern={date:08d}_{annotator}/{layer}/{fname}.{ext}
index=["layer", "date", "annotator", "fname"]
json_relative_path=../../data_source.json

model_spacing=(0.161, 0.161)

[resources]
pool_workers=16
gpu=1
memory=64000

[core]
workers:16
log_level=INFO

[BuildInstanceRecordTask]
min_patch_size = (256, 256)
patch_margins = (10, 10)

[InstanceModelExportTask]
suffix=202103257
plot_dataset=true
resume_weights=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_nuclei_seg/training_output/RDCNet-F4-DC16-G8-DR1-2-4-8-GC64-S5-D0.1_20210325_B/weights_latest.h5

balance_records=false
multi_records_group_keys=["date", "annotator"]
#~input_filters=date in [20210323] & annotator in ["conny"]

save_best=false # save the inference model from the last weights. If true use best weights. Best weights is only available if train_fraction < 1.

input_shape=(None, None, 1)
downsampling_factor=(4,)
n_downsampling_channels=16
n_groups=8
channels_per_group=64
dilation_rates=(1,2,4,8)
dropout=0.1
n_steps=5

augmentation_with_flips=true
augmentation_with_rot90=true
augmentation_gaussian_noise_sigma=0.01
augmentation_gaussian_noise_mu=0.01
augmentation_offset_sigma=2.
augmentation_intensity_scaling=(0.1, 10.)
#~augmentation_angle=180
#~augmentation_shear=5
#~augmentation_zoom_x=(0.9,1.1)
#~augmentation_zoom_y=(0.9,1.1)
#~augmentation_warp_max_amplitude=25
#~augmentation_warp_smoothness_factor=4

intra_margin=1
inter_margin=3
jaccard_hinge=0.3
jaccard_eps=0.1

train_batch_size=4
valid_batch_size=10
train_batches_per_epoch=200
valid_batches=50
epochs=10
lr_max=0.0001
lr_min=0.000001
n_restarts=1
patience=200
patch_size=(256,256,1)


