[DEFAULT]
# luigi output directory for logs, parsed data collections, etc.
outdir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_mip_org_seg/training_output

training_dir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_mip_org_seg/training_output

collection_name=org_seg_training_collection
datadir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_mip_org_seg
pattern={date:08d}_{annotator}/{subset}/{layer}/{fname}.{ext}
index=["layer", "date", "subset", "fname"]
json_relative_path=../../data_source.json

model_spacing=(1.288, 1.288)

[resources]
pool_workers=16
gpu=1
memory=64000

[core]
workers:16
log_level=INFO

[BuildInstanceRecordTask]
min_patch_size = (512, 512)
patch_margins = (10, 10)

[InstanceModelExportTask]
suffix=20210331
plot_dataset=true
resume_weights=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_mip_org_seg/training_output/RDCNet-F8-DC16-G4-DR1-2-4-8-GC32-S6-D0.1_20210327/weights_latest.h5

# balances training records by repeating smaller subsets more frequently
balance_records=true

multi_records_group_keys=["date", "annotator","subset"]
#~input_filters=subset in ["20x_empty_background"]

input_shape=(None, None, 1)
downsampling_factor=(8,)
n_downsampling_channels=16
n_groups=4
channels_per_group=32
dilation_rates=(1,2,4,8)
dropout=0.1
n_steps=6

augmentation_with_flips=true
augmentation_with_rot90=true
augmentation_gaussian_noise_sigma=0.01
augmentation_gaussian_noise_mu=0.01
augmentation_offset_sigma=2.
augmentation_intensity_scaling=(0.1,10.)
augmentation_angle=180
augmentation_shear=5
augmentation_zoom_x=(0.9,1.1)
augmentation_zoom_y=(0.9,1.1)
augmentation_warp_max_amplitude=100
augmentation_warp_smoothness_factor=4

intra_margin=10
inter_margin=80
jaccard_hinge=0.3
jaccard_eps=0.1

train_batch_size=4
valid_batch_size=8
train_batches_per_epoch=200
valid_batches=50
epochs=300
lr_max=0.0001
lr_min=0.000001
n_restarts=5
patience=200
patch_size=(512,512,1)


