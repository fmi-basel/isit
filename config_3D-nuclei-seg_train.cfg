[DEFAULT]
# luigi output directory for logs, parsed data collections, etc.
outdir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/3D_nuclei_seg/training_output

training_dir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/3D_nuclei_seg/training_output

collection_name=3Dnuclei_seg_training_collection
datadir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/3D_nuclei_seg
pattern={date:08d}_{annotator}/{layer}/{fname}.{ext}
index=["layer", "date", "annotator", "fname"]
json_relative_path=../../data_source.json

model_spacing=(0.6, 0.214, 0.214)

[resources]
pool_workers=16
gpu=1
memory=64000

[core]
workers:16
log_level=INFO

[BuildInstanceRecordTask]
min_patch_size = (50,200,200)
patch_margins = (25, 50, 50)

# only for images (stacks) !!!!! --> use all for training, don't monitor the validation loss...
train_fraction=1.
valid_fraction=0.

[InstanceModelExportTask]
suffix=20210327
plot_dataset=true
#~resume_weights=.../weights_latest.h5

balance_records=false
multi_records_group_keys=["date", "annotator"]
#~input_filters=date in [20210323] & annotator in ["conny"]

save_best=false # save the inference model from the last weights. If true use best weights. Best weights is only available if train_fraction < 1.

input_shape=(None, None, None, 1)
downsampling_factor=(2,6,6)
n_downsampling_channels=16
n_groups=4
channels_per_group=32
dilation_rates=(1,2,4,8)
dropout=0.1
n_steps=5

augmentation_with_flips=true
augmentation_with_rot90=true
augmentation_gaussian_noise_sigma=0.03
augmentation_gaussian_noise_mu=0.03
augmentation_offset_sigma=2.
augmentation_intensity_scaling=(0.1, 10.)

intra_margin=1
inter_margin=4
jaccard_hinge=0.3
jaccard_eps=0.1

train_batch_size=1
valid_batch_size=2
train_batches_per_epoch=200
valid_batches=30
epochs=100
lr_max=0.0001
lr_min=0.000001
n_restarts=3
patience=200
patch_size=(50,200,200,1)


