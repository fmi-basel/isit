[DEFAULT]
# luigi output directory for logs, parsed data collections, etc.
#~outdir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT_test_data/org_seg/20x/luigi_out
outdir=/tungstenfs/scratch/gliberal/Users/baadclar/Yokogawa_data/210213CB_Lys-DTR/luigi_out

[resources]
pool_workers=16
gpu=1
memory=64000

[core]
workers:16
log_level=INFO

[SegmentInstancesTask]
# testing on dummy data
#~datadir=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT_test_data/org_seg/20x
#~pattern={layer}/{fname}.{ext}
#~index=["layer", "fname"]

#~input_layer=raw
#~output_layer=pred
#~#input_filters=fname=="210216_190913_210216_191201_C04_T0004F001L04A01Z01C01"

# running on a yokogawa experiment
datadir=/tungstenfs/scratch/gliberal/Users/baadclar/Yokogawa_data/210213CB_Lys-DTR
pattern={platedir}/{layer}/{f1}_{f2}_{f3}_{row}{col:02d}_T{T:04d}F{field:03d}L{L:02d}A{A:02d}Z{zslice:02d}C{channel:02d}.{ext}
index=["layer", "platedir","row", "col", "field", "zslice", "channel", "ext"]

input_layer=TIF_OVR_MIP
output_layer=ORG_SEG_v20210331
#~input_filters=channel==1
# single well for testing
input_filters=channel==1 & platedir=="210203CBLYSDTLGR560" & row=="B" & col==4



collection_name=org_seg_input_collection

# organoid seg model operates on downsampled images (i.e. extra pre/post processing)
# it is beneficial to increase the number of pre/post processing threads to fully load the GPU
n_threads=16

labels_keep_largest=true
labels_fill_holes=True

image_spacing=(0.322, 0.322)
model_path=/tungstenfs/scratch/gliberal/Users/ortiraph/datasets/ISIT/2D_mip_org_seg/training_output/RDCNet-F8-DC16-G4-DR1-2-4-8-GC32-S6-D0.1_20210331_inference

# if running out GPU memory, out of memory error (OOM), define a patch size to use for tile processing
# border should be roughly the size of the object to segment (in pixels, on image downsampled to model_spacing)
#~tiling_patch_size=(1300, 1300, 1)
#~tiling_border=(300,300,0)
# clustering embeddings of many instances on the gpu can also require a large amount of memory --> set to false to disable
#~gpu_postproc=false
